name: Mail
options:
  bundleIdPrefix: dev.openhuman
  deploymentTarget: { macOS: "26.0" }
  createIntermediateGroups: true
  preGenCommand: python3 ../../Tools/ci/checklist.py build
configs:
  Debug: debug
  DevTools: release
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  DevTools: Config/DevTools.xcconfig
  Release: Config/Release.xcconfig
packages:
  OpenHumanMailUI: { path: ../../Packages/OpenHumanMailUI }
  OpenHumanMailCore: { path: ../../Packages/OpenHumanMailCore }
  OpenHumanStore: { path: ../../Packages/OpenHumanStore }
  OpenHumanGmail: { path: ../../Packages/OpenHumanGmail }
  OpenHumanSync: { path: ../../Packages/OpenHumanSync }
  OpenHumanAI: { path: ../../Packages/OpenHumanAI }
  OpenHumanAIMLX: { path: ../../Packages/OpenHumanAIMLX }
  OpenHumanSemanticIndex: { path: ../../Packages/OpenHumanSemanticIndex }
  OpenHumanMailLive: { path: ../../Packages/OpenHumanMailLive }
  # In-app updates (docs/release/SPARKLE.md). Keep in step with SPARKLE_VERSION in Tools/versions.env
  Sparkle: { url: https://github.com/sparkle-project/Sparkle, exactVersion: 2.10.0 }
targets:
  Mail:
    type: application
    platform: macOS
    sources: [Sources, { path: Resources, excludes: ["checklist/**"] }]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: $(OH_ENTITLEMENTS)
    info:
      path: Resources/Info.generated.plist
      properties:
        CFBundleDisplayName: "OpenHuman Mail"
        CFBundleName: "OpenHuman Mail"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "26.0"
        LSFileQuarantineEnabled: true
        CFBundleURLTypes:
          - { CFBundleURLName: dev.openhuman.mail.link, CFBundleURLSchemes: [openhuman] }
          - { CFBundleURLName: dev.openhuman.mail.mailto, CFBundleURLSchemes: [mailto] }
        NSServices:
          - NSMenuItem: { default: "New Message in OpenHuman Mail" }
            NSMessage: newMessageWithSelection
            NSPortName: OpenHumanMail
            NSSendTypes: [public.utf8-plain-text]
          - NSMenuItem: { default: "New Message with Files in OpenHuman Mail" }
            NSMessage: newMessageWithFiles
            NSPortName: OpenHumanMail
            NSSendFileTypes: [public.item]
          - NSMenuItem: { default: "Search in OpenHuman Mail" }
            NSMessage: searchWithSelection
            NSPortName: OpenHumanMail
            NSSendTypes: [public.utf8-plain-text]
        OHGitCommit: $(OH_GIT_COMMIT)
        OHReleaseChannel: $(OH_RELEASE_CHANNEL)
        # Used only once the signature grants the group; ad hoc and CI builds keep the default group
        OHKeychainAccessGroup: $(AppIdentifierPrefix)dev.openhuman.shared
        # Sparkle reads the appcast that the release workflow adds to main (docs/release/SPARKLE.md)
        SUFeedURL: https://raw.githubusercontent.com/michaelmagan/OpenHuman/main/appcast.xml
        # The base64 public key printed by Sparkle's generate_keys. Until it is set, Mail keeps the GitHub check
        # and the release workflow refuses to run. Written here, not in an .xcconfig, where "//" starts a comment
        SUPublicEDKey: ""
    postBuildScripts:
      - name: Stamp git commit
        basedOnDependencyAnalysis: false
        script: |
          [ "${OH_GIT_COMMIT}" = "unknown" ] || exit 0
          commit="$(git -C "${SRCROOT}" rev-parse --short HEAD 2>/dev/null)" || exit 0
          [ -n "$(git -C "${SRCROOT}" status --porcelain --untracked-files=no 2>/dev/null)" ] && commit="${commit}+dirty"
          /usr/libexec/PlistBuddy -c "Set :OHGitCommit ${commit}" "${TARGET_BUILD_DIR}/${INFOPLIST_PATH}" 2>/dev/null || true
    dependencies:
      - package: OpenHumanMailUI
        product: MailUIMac
      - { package: OpenHumanMailUI, product: MailUI }
      - { package: OpenHumanMailCore, product: MailFeatures }
      - { package: OpenHumanMailCore, product: MailModel }
      - { package: OpenHumanMailCore, product: MailFakes }
      - { package: OpenHumanStore, product: OpenHumanStore }
      - { package: OpenHumanGmail, product: OpenHumanGmail }
      - { package: OpenHumanGmail, product: OpenHumanGmailApple }
      # Linked in every flavour; only Debug and DevTools builds compile the -UseFakeGmail entry point that uses it
      - { package: OpenHumanGmail, product: OpenHumanGmailTesting }
      - { package: OpenHumanSync, product: OpenHumanSync }
      - { package: OpenHumanAI, product: OpenHumanAI }
      - { package: OpenHumanAI, product: OpenHumanAIApple }
      - { package: OpenHumanAI, product: OpenHumanAIAgentCLI }
      - { package: OpenHumanAI, product: OpenHumanAITesting }
      - { package: OpenHumanAIMLX, product: OpenHumanAIMLX }
      - { package: OpenHumanAIMLX, product: OpenHumanAIMLXRuntime }
      - { package: OpenHumanSemanticIndex, product: OpenHumanSemanticIndex }
      - { package: OpenHumanMailLive, product: OpenHumanMailLive }
      - { package: OpenHumanMailLive, product: MailSystem }
      - { package: Sparkle, product: Sparkle }
  MailAppTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/MailAppTests]
    dependencies: [{ target: Mail }]
    settings:
      PRODUCT_NAME: MailAppTests
      PRODUCT_BUNDLE_IDENTIFIER: $(OH_BUNDLE_ID_PREFIX).mail.tests
      TEST_HOST: $(BUILT_PRODUCTS_DIR)/OpenHumanMail.app/Contents/MacOS/OpenHumanMail
      BUNDLE_LOADER: $(TEST_HOST)
      GENERATE_INFOPLIST_FILE: YES
schemes:
  Mail:
    build: { targets: { Mail: all } }
    run:
      config: Debug
      # Untick to sign in to a real account: every change then reaches Gmail
      commandLineArguments: { "-UseFakeGmail": true }
    test:
      config: Debug
      targets: [MailAppTests]
      commandLineArguments: { "-UseFakeData": true, "-UseFakeCalendar": true }
    analyze: { config: Debug }
    profile: { config: Release }
    archive: { config: Release }
