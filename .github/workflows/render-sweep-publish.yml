name: Render Sweep Publish

# SECURITY: publishes the renders of fork pull requests, whose own Render Sweep run gets a read-only token.
# workflow_run always runs this file and the scripts from the default branch (trusted), never fork code. It treats the
# downloaded artifacts as hostile: it runs nothing from them, validates the pull request number and head sha, checks
# that the pull request's head really is the commit that was rendered, and copies only plain PNG files.
# Same-repository pull requests are published by the publish job in render-sweep.yml instead.

on:
  workflow_run:
    workflows: [Render Sweep]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

# Why: shared with the publish job in render-sweep.yml; every publish edits the one pr-screenshots release
concurrency:
  group: render-sweep-publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: Tools/ci

      - uses: actions/download-artifact@v4
        with:
          name: render-sweep-meta
          path: meta
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: render-sweep
          path: renders
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate the pull request
        id: meta
        env:
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr="$(head -c 32 meta/number | tr -d '[:space:]')"
          sha="$(head -c 64 meta/head_sha | tr -d '[:space:]')"
          [[ "$pr" =~ ^[0-9]+$ ]] || { echo "::error::invalid pull request number in the artifact"; exit 1; }
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::invalid head sha in the artifact"; exit 1; }
          [ "$sha" = "$RUN_HEAD_SHA" ] || { echo "::error::the artifact's head sha is not the run's"; exit 1; }
          head="$(gh pr view "$pr" --json headRefOid --jq .headRefOid)"
          if [ "$head" != "$sha" ]; then
            echo "::notice::#$pr has moved on from $sha (now $head); a newer sweep will publish"
            exit 0
          fi
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Publish to the pull request
        if: steps.meta.outputs.pr != ''
        env:
          PR: ${{ steps.meta.outputs.pr }}
          SHA: ${{ steps.meta.outputs.sha }}
        run: Tools/ci/publish-render-sweep.sh renders "$PR" "$SHA"
