name: CI

on:
  push:
    branches: [main]
  # Pull requests that change only documentation or images skip these jobs.
  # Nothing is a required check, so a skipped workflow cannot block a merge;
  # pushes to main always run everything.
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

# A new push to a pull request cancels its older run. Runs on main are never cancelled:
# each one is the record that main is green, and it refreshes the build caches that
# pull requests restore.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Why: fast feedback on a hosted runner, without waiting for the self-hosted Mac
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Why: check-test-patterns diffs against the merge base with the PR's base branch
          fetch-depth: 0
          persist-credentials: false

      - name: Check imports and generated contracts
        run: |
          Tools/ci/check-imports.sh
          python3 Tools/ci/check-checklist.py
          python3 -m unittest discover -s Tools/ci/tests -p 'test_*.py'

      - name: Check added test lines
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 -B Tools/ci/check-test-patterns.py --base "origin/$BASE_REF"

      - name: Check Package.resolved files agree
        run: python3 -B Tools/ci/check-resolved.py

      - name: Shellcheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck -S warning

  # Build caches. Pull requests can restore caches saved on main, but not those of other
  # pull requests, so main saves after every run and a pull request saves only when it found
  # nothing to restore. Package .build folders keep the compiled dependencies (MLX, GRDB,
  # SwiftSoup and the rest); the packages' own sources are rebuilt because a fresh checkout
  # gives them new modification times. Xcode's compilation cache is keyed on content, so the
  # app build replays every unchanged compile job. It starts over each month.
  #
  # The package caches leave out SwiftPM's build descriptions (XCBuildData/*.xcbuilddata).
  # They record absolute tool paths, and the Metal toolchain is mounted at a random path on
  # each runner, so a restored description runs a metal compiler that no longer exists.
  # SwiftPM regenerates them in seconds; build.db stays, so only the tasks whose tool paths
  # changed (the MLX shader compiles and the links) run again.

  macos-packages:
    runs-on: ${{ vars.MACOS_RUNNER_LABEL || 'xcode-27' }}
    timeout-minutes: 60
    env:
      # Why: a released Xcode, never the newest installed beta
      XCODE_APP: ${{ vars.XCODE_APP || '/Applications/Xcode_27.0.app' }}
      XCODE_VERSION: ${{ vars.XCODE_VERSION || '27.0' }}
      SWIFT_BACKTRACE: enable=yes,sanitize=yes,threads=all
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/select-xcode
        id: xcode

      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: cache
        with:
          path: |
            Packages/*/.build
            !Packages/OpenHumanMailUI/.build
            !Packages/*/.build/*/debug/index
            !Packages/*/.build/out/Intermediates.noindex/XCBuildData/*.xcbuilddata
          key: spm-packages-v2-${{ steps.xcode.outputs.build }}-${{ hashFiles('Packages/*/Package.resolved', 'Packages/*/Package.swift') }}-${{ github.sha }}
          restore-keys: |
            spm-packages-v2-${{ steps.xcode.outputs.build }}-${{ hashFiles('Packages/*/Package.resolved', 'Packages/*/Package.swift') }}-
            spm-packages-v2-${{ steps.xcode.outputs.build }}-

      - name: Drop restored build descriptions
        run: rm -rf Packages/*/.build/out/Intermediates.noindex/XCBuildData/*.xcbuilddata

      - name: Build and test packages
        env:
          OH_TEST_LOG_DIR: ${{ runner.temp }}/package-test-logs
        run: Tools/ci/build-packages.sh --platform macos --exclude OpenHumanMailUI

      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: ${{ !cancelled() && (github.ref == 'refs/heads/main' || steps.cache.outputs.cache-matched-key == '') }}
        with:
          path: |
            Packages/*/.build
            !Packages/OpenHumanMailUI/.build
            !Packages/*/.build/*/debug/index
            !Packages/*/.build/out/Intermediates.noindex/XCBuildData/*.xcbuilddata
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Print last started tests
        if: failure()
        run: |
          if [ -d "$RUNNER_TEMP/package-test-logs" ]; then
            find "$RUNNER_TEMP/package-test-logs" -name '*.log' -type f -print0 \
              | xargs -0 grep -hE 'Test (Case )?.*started' | tail -n 40 || true
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: package-diagnostics
          path: |
            ${{ runner.temp }}/package-test-logs/*.log
            ~/Library/Logs/DiagnosticReports/*.ips
            ~/Library/Logs/DiagnosticReports/*.crash
          if-no-files-found: ignore

  macos-app:
    runs-on: ${{ vars.MACOS_RUNNER_LABEL || 'xcode-27' }}
    timeout-minutes: 90
    env:
      XCODE_APP: ${{ vars.XCODE_APP || '/Applications/Xcode_27.0.app' }}
      XCODE_VERSION: ${{ vars.XCODE_VERSION || '27.0' }}
      SWIFT_BACKTRACE: enable=yes,sanitize=yes,threads=all
      OH_COMPILATION_CACHE_PATH: ${{ github.workspace }}/build/compilation-cache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/select-xcode
        id: xcode

      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: cache
        with:
          path: |
            build/compilation-cache
            build/test-dd/SourcePackages
            build/dd/SourcePackages
          key: xcode-app-v1-${{ steps.xcode.outputs.build }}-${{ steps.xcode.outputs.month }}-${{ github.sha }}
          restore-keys: |
            xcode-app-v1-${{ steps.xcode.outputs.build }}-${{ steps.xcode.outputs.month }}-

      - name: Check imports and generated contracts
        run: |
          Tools/ci/check-imports.sh
          python3 Tools/ci/check-checklist.py
          python3 -m unittest discover -s Tools/ci/tests -p 'test_*.py'

      - name: Bootstrap app project
        run: Tools/bootstrap.sh

      - name: Generate the project from a source archive
        run: |
          src="$RUNNER_TEMP/source-archive"
          rm -rf "$src" && mkdir -p "$src"
          git archive HEAD | tar -x -C "$src"
          mkdir -p "$src/Tools" && cp -R Tools/.bin "$src/Tools/.bin"
          "$src/Tools/bootstrap.sh"
          test -d "$src/Apps/Mail/Mail.xcodeproj"

      - name: Test app against fixtures
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test -project Apps/Mail/Mail.xcodeproj -scheme Mail \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath build/test-dd \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            COMPILATION_CACHE_ENABLE_CACHING=YES "COMPILATION_CACHE_CAS_PATH=$OH_COMPILATION_CACHE_PATH" \
            -resultBundlePath build/TestResults.xcresult 2>&1 | tee "$RUNNER_TEMP/app-test.log"

      - name: Build development artifact
        run: Tools/ci/build-app.sh --build-number "${{ github.run_number }}"

      - name: Package development artifact
        run: Tools/ci/package-app.sh build/dd/Build/Products/Release/OpenHumanMail.app build/OpenHumanMail.zip

      - name: Report compilation cache size
        if: ${{ !cancelled() }}
        run: du -sh "$OH_COMPILATION_CACHE_PATH" || true

      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: ${{ !cancelled() && (github.ref == 'refs/heads/main' || steps.cache.outputs.cache-matched-key == '') }}
        with:
          path: |
            build/compilation-cache
            build/test-dd/SourcePackages
            build/dd/SourcePackages
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: OpenHumanMail-${{ github.run_number }}
          path: build/OpenHumanMail.zip
          retention-days: 14

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: test-results
          path: build/TestResults.xcresult

      - name: Print last started tests
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/app-test.log" ]; then
            grep -E 'Test (Case )?.*started' "$RUNNER_TEMP/app-test.log" | tail -n 40 || true
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: app-diagnostics
          path: |
            ${{ runner.temp }}/app-test.log
            ~/Library/Logs/DiagnosticReports/*.ips
            ~/Library/Logs/DiagnosticReports/*.crash
          if-no-files-found: ignore

  macos-mail-ui:
    runs-on: ${{ vars.MACOS_RUNNER_LABEL || 'xcode-27' }}
    timeout-minutes: 120
    env:
      XCODE_APP: ${{ vars.XCODE_APP || '/Applications/Xcode_27.0.app' }}
      XCODE_VERSION: ${{ vars.XCODE_VERSION || '27.0' }}
      SWIFT_BACKTRACE: enable=yes,sanitize=yes,threads=all
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/select-xcode
        id: xcode

      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: cache
        with:
          path: |
            Packages/OpenHumanMailUI/.build
            !Packages/OpenHumanMailUI/.build/*/debug/index
            !Packages/OpenHumanMailUI/.build/out/Intermediates.noindex/XCBuildData/*.xcbuilddata
          key: spm-mail-ui-v2-${{ steps.xcode.outputs.build }}-${{ hashFiles('Packages/*/Package.resolved', 'Packages/*/Package.swift') }}-${{ github.sha }}
          restore-keys: |
            spm-mail-ui-v2-${{ steps.xcode.outputs.build }}-${{ hashFiles('Packages/*/Package.resolved', 'Packages/*/Package.swift') }}-
            spm-mail-ui-v2-${{ steps.xcode.outputs.build }}-

      - name: Drop restored build descriptions
        run: rm -rf Packages/OpenHumanMailUI/.build/out/Intermediates.noindex/XCBuildData/*.xcbuilddata

      - name: Test Mail UI and window layouts
        env:
          OH_TEST_LOG_DIR: ${{ runner.temp }}/package-test-logs
        run: Tools/ci/build-packages.sh --platform macos --serialized-tests OpenHumanMailUI

      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: ${{ !cancelled() && (github.ref == 'refs/heads/main' || steps.cache.outputs.cache-matched-key == '') }}
        with:
          path: |
            Packages/OpenHumanMailUI/.build
            !Packages/OpenHumanMailUI/.build/*/debug/index
            !Packages/OpenHumanMailUI/.build/out/Intermediates.noindex/XCBuildData/*.xcbuilddata
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Print last started tests
        if: failure()
        run: |
          if [ -d "$RUNNER_TEMP/package-test-logs" ]; then
            find "$RUNNER_TEMP/package-test-logs" -name '*.log' -type f -print0 \
              | xargs -0 grep -hE 'Test (Case )?.*started' | tail -n 40 || true
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: mail-ui-diagnostics
          path: |
            ${{ runner.temp }}/package-test-logs/*.log
            ~/Library/Logs/DiagnosticReports/*.ips
            ~/Library/Logs/DiagnosticReports/*.crash
          if-no-files-found: ignore
