version: 2

# Every ecosystem waits 7 days after a release before proposing it, so a
# compromised or yanked version has time to be caught upstream first.
# Security updates bypass the cooldown. Minors and patches land as one PR per
# ecosystem; majors come one PR each.
#
# Swift packages are not listed: Dependabot's Swift updater runs an older
# toolchain than the swift-tools-version the packages declare, so
# `swift package show-dependencies` fails before any update is attempted.
# Swift dependencies are bumped by hand until the updater catches up.
updates:
  # Workflow actions are pinned to commit SHAs; Dependabot rewrites both the
  # SHA and its trailing `# vN` comment. The local composite actions under
  # .github/actions are listed too, so any action they call is kept current.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
